on:
  workflow_call:
    inputs:
      branch_name:
        type: string
        required: true
      container_branch:
        type: string
        required: false
        default: ''
      cache_version:
        type: string
        default: '1'
      update_docker:
        description: 'JSON list of Docker image variants to update, e.g. ["release","r-devel"]'
        type: string
        default: '[]'
      use-containers:
        type: boolean
        default: true
    outputs:
      ci_container:
        description: "Updated CI container path"
        value: ${{ jobs.docker.outputs.ci_container }}
      ci_r_devel_container:
        description: "Updated CI R-devel container path"
        value: ${{ jobs.docker.outputs.ci_r_devel_container }}

permissions:
  contents: write
  pull-requests: write
  packages: write


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}


jobs:
  docker:
    name: 🐋 Update docker image and files
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      ci_container: ${{ steps.image_job.outputs.ci_container }}
      ci_r_devel_container: ${{ steps.image_job.outputs.ci_r_devel_container }}

    steps:
      - name: ⚙️ Generate tags for CI images
        id: tag
        run: |
          # Convert IMAGE_NAME to lowercase
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')

          CONTAINER_BRANCH="${{ inputs.container_branch }}"
          if [ -z "${CONTAINER_BRANCH}" ]; then
            CONTAINER_BRANCH="${{ inputs.branch_name }}"
          fi

          # Replace / with - in BRANCH_TAG
          BRANCH_TAG_CLEAN=$(echo "${CONTAINER_BRANCH}" | tr '/' '-')

          DEV_IMAGE="${{ env.REGISTRY }}/${IMAGE_NAME_LOWER}:${BRANCH_TAG_CLEAN}"
          CI_IMAGE="${DEV_IMAGE}-ci"
          CI_R_DEVEL_IMAGE="${CI_IMAGE}-r-devel"

          echo "Generated dev image reference is: ${DEV_IMAGE}"
          echo "Generated CI image reference is: ${CI_IMAGE}"
          echo "Generated CI R-devel image reference is: ${CI_R_DEVEL_IMAGE}"
          echo "dev_tag=${DEV_IMAGE}" >> $GITHUB_OUTPUT
          echo "ci_tag=${CI_IMAGE}" >> $GITHUB_OUTPUT
          echo "ci_r_devel_tag=${CI_R_DEVEL_IMAGE}" >> $GITHUB_OUTPUT

      - name: Dump github context
        if: ${{ inputs.update_docker != '[]' }}
        run:   echo "$GITHUB_CONTEXT"
        shell: bash
        env:
         GITHUB_CONTEXT: ${{ toJson(github) }}

      - name: ⬇️ Checkout repo
        if: ${{ inputs.update_docker != '[]' }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 🔧 Configure git
        if: ${{ inputs.update_docker != '[]' }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git config --local user.name "${{ github.actor }}"
          git config --local user.email "${{ github.actor }}@users.noreply.github.com"
          if [ "${{ github.event.pull_request.head.repo.fork }}" == "true" ]; then
            # For PRs from forks
            git remote add fork ${{ github.event.pull_request.head.repo.clone_url }}
            git remote set-url fork https://x-access-token:${{ github.token }}@github.com/${{ github.event.pull_request.head.repo.full_name }}.git
            git fetch fork ${{ github.event.pull_request.head.ref }}
            git checkout -b ${{ inputs.branch_name }} fork/${{ github.event.pull_request.head.ref }}
          else
            # For PRs from the same repository
            git remote set-url origin https://$GITHUB_ACTOR:${{ secrets.GH_PAT }}@github.com/$GITHUB_REPOSITORY.git
            git switch "${{ inputs.branch_name }}"
          fi

      - name: 🔧 Resolve R-devel base image digest
        id: r_devel_base_image
        if: ${{ contains(fromJSON(inputs.update_docker), 'r-devel') }}
        run: |
          set -euo pipefail

          R_DEVEL_BASE_IMAGE="rocker/tidyverse:devel"
          R_DEVEL_BASE_DIGEST=$(docker manifest inspect "${R_DEVEL_BASE_IMAGE}" | jq -r '
            if has("manifests") then
              ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest][0] // "")
            else
              (.config.digest // "")
            end
          ')

          if [ -z "${R_DEVEL_BASE_DIGEST}" ] || [ "${R_DEVEL_BASE_DIGEST}" = "null" ]; then
            echo "Could not resolve digest for ${R_DEVEL_BASE_IMAGE}"
            exit 1
          fi

          echo "Resolved ${R_DEVEL_BASE_IMAGE} to ${R_DEVEL_BASE_DIGEST}"
          echo "digest=${R_DEVEL_BASE_DIGEST}" >> $GITHUB_OUTPUT

      - name: 🔧 Resolve arf release
        id: arf_release
        if: ${{ inputs.update_docker != '[]' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_JSON=$(curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/eitsupi/arf/releases/latest)

          ARF_TAG=$(jq -r '.tag_name // empty' <<< "${RELEASE_JSON}")
          ARF_DIGEST=$(jq -r '.assets[] | select(.name == "arf-console-installer.sh") | .digest // empty' <<< "${RELEASE_JSON}")

          if [ -z "${ARF_TAG}" ] || [ -z "${ARF_DIGEST}" ] || [[ "${ARF_DIGEST}" != sha256:* ]]; then
            echo "Could not resolve the latest stable arf release and installer digest"
            exit 1
          fi

          ARF_VERSION="${ARF_TAG#v}"
          ARF_SHA256="${ARF_DIGEST#sha256:}"
          ARF_RELEASE="${ARF_TAG}@${ARF_DIGEST}"

          echo "Resolved arf ${ARF_TAG} with installer digest ${ARF_DIGEST}"
          echo "tag=${ARF_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${ARF_VERSION}" >> "$GITHUB_OUTPUT"
          echo "digest=${ARF_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "sha256=${ARF_SHA256}" >> "$GITHUB_OUTPUT"
          echo "release=${ARF_RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Generate dockerfiles
        if: ${{ inputs.update_docker != '[]' }}
        run: |
          cat > dockerfile <<'DOCKERFILE'
          FROM rocker/tidyverse
          ENV TZ=Australia/Sydney
          RUN date

          # System and development dependencies
          RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates \
              curl \
              docker.io \
              git \
              gnupg2 \
              libcurl4-gnutls-dev \
              openssh-client \
              sudo \
              xz-utils \
              && rm -rf /var/lib/apt/lists/*

          # Install the latest stable arf release
          ARG ARF_VERSION=${{ steps.arf_release.outputs.version }}
          ARG ARF_INSTALLER_SHA256=${{ steps.arf_release.outputs.sha256 }}
          RUN curl --proto '=https' --tlsv1.2 -LsSf \
                "https://github.com/eitsupi/arf/releases/download/v${ARF_VERSION}/arf-console-installer.sh" \
                -o /tmp/arf-installer.sh \
              && echo "${ARF_INSTALLER_SHA256}  /tmp/arf-installer.sh" | sha256sum -c - \
              && CARGO_DIST_FORCE_INSTALL_DIR=/usr/local sh /tmp/arf-installer.sh \
              && rm /tmp/arf-installer.sh \
              && arf --version

          # Move pak.lock to the container
          COPY . /app/
          WORKDIR /app

          # tex packages are installed in /root/bin so we have to make sure those
          # packages accessible by adding that directory to the PATH variable.
          ENV PATH="${PATH}:/root/bin"

          RUN R -e 'install.packages("pak")'

          RUN R -e 'getwd(); dir()'

          # Remove dev package from pak.lock
          RUN R -e 'pak::pak("jsonlite"); d <- jsonlite::read_json("pak.lock"); d$packages <- Filter(\(x) x$package != "${{ github.event.repository.name }}", d$packages); print(unlist(Map(\(x) x$package, d$packages))); jsonlite::write_json(d, "pak.lock", auto_unbox = TRUE)'

          # Install package dependencies
          RUN R -e 'pkgs <- jsonlite::fromJSON("pak.lock")$packages; pak::pak(paste0(pkgs$package, "@" ,pkgs$version))'

          # Install workflow and VS Code development dependencies
          RUN R -e 'pak::pak(c("jsonlite", "rcmdcheck", "devtools", "lintr", "covr", "roxygen2", "pkgdown", "rmarkdown", "styler", "languageserver", "httpgd"))'

          # Install the dev package
          RUN R -e 'devtools::install()'

          # Give the non-root Rocker user a writable personal package library
          # for packages installed interactively while using the dev container.
          RUN mkdir -p /home/rstudio/R/library \
              && chown -R rstudio:rstudio /home/rstudio/R
          ENV R_LIBS_USER=/home/rstudio/R/library
          DOCKERFILE

          cat > dockerfile-r-devel <<'DOCKERFILE'
          FROM rocker/tidyverse:devel
          ENV TZ=Australia/Sydney
          RUN date

          # System dependencies (apt-get since r-base is debian based)
          RUN apt-get update
          RUN apt-get install -y libcurl4-gnutls-dev curl # curl files
          RUN apt-get install -y docker.io # docker interface
          RUN apt-get install -y gnupg2 # required to install odbc

          # Move pak.lock to the container
          COPY . /app/
          WORKDIR /app

          # tex packages are installed in /root/bin so we have to make sure those
          # packages accessible by adding that directory to the PATH variable.
          ENV PATH="${PATH}:/root/bin"

          RUN R -e 'install.packages("pak")'

          RUN R -e 'getwd(); dir()'

          # Install package dependencies compatible with R-devel
          RUN R -e 'pak::local_install_dev_deps()'

          # Install workflow dependencies
          RUN R -e 'pak::pak(c("jsonlite", "rcmdcheck", "devtools", "lintr", "covr", "roxygen2", "pkgdown", "rmarkdown", "styler"))'

          # Install the dev package
          RUN R -e 'devtools::install()'
          DOCKERFILE

          DEV_IMAGE="${{ steps.tag.outputs.dev_tag }}"

          mkdir -p .devcontainer
          cat > .devcontainer/devcontainer.json <<DEVCONTAINER
          {
            "name": "${{ github.event.repository.name }}",
            "image": "${DEV_IMAGE}",
            "overrideCommand": false,
            "remoteUser": "rstudio",
            "containerEnv": {
              "ROOT": "true"
            },
            "customizations": {
              "vscode": {
                "extensions": [
                  "REditorSupport.r"
                ],
                "settings": {
                  "r.rpath.linux": "/usr/local/bin/R",
                  "r.rterm.linux": "/usr/local/bin/arf",
                  "r.bracketedPaste": true,
                  "r.alwaysUseActiveTerminal": true
                }
              }
            }
          }
          DEVCONTAINER

          echo "Generated dev container configuration for ${DEV_IMAGE}"

          mkdir -p .github
          printf '%s\n' '${{ steps.arf_release.outputs.release }}' > .github/arf-release
          echo "Recorded arf release: $(cat .github/arf-release)"

          if echo '${{ inputs.update_docker }}' | jq -e 'index("r-devel")' > /dev/null; then
            printf '%s\n' '${{ steps.r_devel_base_image.outputs.digest }}' > .github/r-devel-base-digest
            echo "Recorded R-devel base image digest: $(cat .github/r-devel-base-digest)"
          fi

          cat dockerfile
          cat dockerfile-r-devel
          cat .devcontainer/devcontainer.json

      - name: ⬆️ Commit changes
        if: ${{ inputs.update_docker != '[]' }}
        run: |
          git stash --include-untracked

          if [ "${{ github.event.pull_request.head.repo.fork }}" == "true" ]; then
            # For PRs from forks - use the fork's URL and the GITHUB_TOKEN
            git pull --rebase fork ${{ github.event.pull_request.head.ref }}
          else
            # For PRs from the same repository
            git pull --rebase origin ${{ inputs.branch_name }}
          fi

          git stash list | grep stash@{0} && git stash pop || echo "No stash to pop"
          git add dockerfile dockerfile-r-devel .devcontainer/devcontainer.json .github/arf-release
          git add .github/r-devel-base-digest 2>/dev/null || true
          git commit -m "chore: Update Docker specifications" || echo "No changes to commit"

      - name: 🐋 Log in to the Container registry
        if: ${{ inputs.update_docker != '[]' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐋 Extract metadata (tags, labels) for Docker
        if: ${{ inputs.update_docker != '[]' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: 🔧 Build and push dev and CI Docker image
        if: ${{ contains(fromJSON(inputs.update_docker), 'release') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.dev_tag }}
            ${{ steps.tag.outputs.ci_tag }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            dk.ssi.ci.arf-version=${{ steps.arf_release.outputs.version }}
            dk.ssi.ci.arf-installer-digest=${{ steps.arf_release.outputs.digest }}

      - name: 🔧 Build and push R-devel Docker image
        if: ${{ contains(fromJSON(inputs.update_docker), 'r-devel') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile-r-devel
          push: true
          tags: ${{ steps.tag.outputs.ci_r_devel_tag }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            dk.ssi.ci.r-devel-base-image=rocker/tidyverse:devel
            dk.ssi.ci.r-devel-base-digest=${{ steps.r_devel_base_image.outputs.digest }}

      - name: 🔍 Check if CI Docker images exist in GHCR
        id: image_job
        if: ${{ !cancelled() }}
        run: |
          CI_IMAGE="${{ steps.tag.outputs.ci_tag }}"
          CI_R_DEVEL_IMAGE="${{ steps.tag.outputs.ci_r_devel_tag }}"

          echo "Checking for CI image: ${CI_IMAGE}"
          echo "Checking for CI R-devel image: ${CI_R_DEVEL_IMAGE}"

          # Try to pull the image metadata (doesn't download full image)
          if [[ "${{ inputs.use-containers }}" == "false" ]]; then
            echo "Use of containers is disabled"
            echo "ci_container=null" >> $GITHUB_OUTPUT
            echo "ci_r_devel_container=null" >> $GITHUB_OUTPUT
          else
            if docker manifest inspect "${CI_IMAGE}" > /dev/null 2>&1; then
              echo "CI image found in GHCR"
              printf 'ci_container="%s"\n' "${CI_IMAGE}" >> $GITHUB_OUTPUT
            else
              echo "CI image not found in GHCR"
              echo "ci_container=null" >> $GITHUB_OUTPUT
            fi

            if docker manifest inspect "${CI_R_DEVEL_IMAGE}" > /dev/null 2>&1; then
              echo "CI R-devel image found in GHCR"
              printf 'ci_r_devel_container="%s"\n' "${CI_R_DEVEL_IMAGE}" >> $GITHUB_OUTPUT
            else
              echo "CI R-devel image not found in GHCR"
              echo "ci_r_devel_container=null" >> $GITHUB_OUTPUT
            fi
          fi

      - name: 🚀 Push changes
        if: ${{ !cancelled() && inputs.update_docker != '[]' }}
        run: |
          set -o xtrace

          if [ "${{ github.event.pull_request.head.repo.fork }}" == "true" ]; then
            # For PRs from forks - use the fork's URL and the GITHUB_TOKEN
            git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.event.pull_request.head.repo.owner.login }}/${{ github.event.pull_request.head.repo.name }}.git HEAD:${{ github.event.pull_request.head.ref }}
          else
            # For PRs from the same repository
            git push origin ${{ inputs.branch_name }}
          fi
